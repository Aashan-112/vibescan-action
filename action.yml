name: VibeScan Security Scanner
description: >
  Automated security scanning for vibe-coded apps built with Lovable,
  Bolt.new, v0, and Replit — plus mobile, LLM/AI, and cloud-native
  vulnerability detection. Validated against 91 real-world repositories
  including OWASP Benchmark apps and documented CVEs.

author: VibeScan
branding:
  icon: shield
  color: green

inputs:
  api-key:
    description: 'VibeScan API key. Get one free at vibecodescan.vercel.app/account/keys'
    required: true
  platform:
    description: 'lovable, bolt, v0, replit, or auto'
    required: false
    default: auto
  fail-on-critical:
    description: 'Fail the workflow if critical issues are found'
    required: false
    default: 'true'
  fail-on-important:
    description: 'Fail the workflow if important issues are found'
    required: false
    default: 'false'
  comment-on-pr:
    description: 'Post results as a PR comment'
    required: false
    default: 'true'
  github-token:
    description: 'GITHUB_TOKEN, used for private repo access and PR comments'
    required: false
    default: ${{ github.token }}

outputs:
  score:
    description: Security score (A-F)
  critical-count:
    description: Number of critical findings
  total-findings:
    description: Total findings
  report-url:
    description: Link to the full report

runs:
  using: composite
  steps:
    - name: Trigger VibeScan
      shell: bash
      id: trigger
      run: |
        echo "🔍 Submitting scan to VibeScan..."

        RESPONSE=$(curl -s -w "\n%{http_code}" \
          -X POST "https://vibecodescan.vercel.app/api/scan/github" \
          -H "Authorization: Bearer ${{ inputs.api-key }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"repo\": \"${{ github.repository }}\",
            \"sha\": \"${{ github.sha }}\",
            \"platform\": \"${{ inputs.platform }}\",
            \"githubToken\": \"${{ inputs.github-token }}\"
          }")

        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | head -n-1)

        if [ "$HTTP_CODE" != "200" ]; then
          echo "⚠️ VibeScan trigger failed ($HTTP_CODE): $BODY"
          echo "score=unknown" >> $GITHUB_OUTPUT
          exit 0   # don't block the workflow on VibeScan being down
        fi

        SCAN_ID=$(echo $BODY | jq -r '.scanId')
        STATUS_URL=$(echo $BODY | jq -r '.statusUrl')
        echo "scan_id=$SCAN_ID" >> $GITHUB_OUTPUT
        echo "status_url=$STATUS_URL" >> $GITHUB_OUTPUT
        echo "✅ Scan submitted — ID: $SCAN_ID"

    - name: Poll for results
      shell: bash
      id: poll
      run: |
        STATUS_URL="${{ steps.trigger.outputs.status_url }}"
        if [ -z "$STATUS_URL" ]; then
          echo "No scan triggered, skipping poll."
          exit 0
        fi

        echo "⏳ Waiting for scan to complete..."
        MAX_ATTEMPTS=30   # ~90 seconds at 3s intervals
        ATTEMPT=0

        while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
          RESPONSE=$(curl -s "$STATUS_URL")
          STATUS=$(echo $RESPONSE | jq -r '.status')

          # IMPORTANT: the API returns "complete" — NOT "completed".
          # Confirmed via live production E2E test, commit 7548bb3, scan ID 58ba099a.
          if [ "$STATUS" = "complete" ]; then
            echo "✅ Scan complete"
            echo "$RESPONSE" > vibescan-results.json
            break
          fi

          if [ "$STATUS" = "failed" ]; then
            echo "❌ Scan failed on VibeScan's side"
            exit 0   # don't block the workflow
          fi

          sleep 3
          ATTEMPT=$((ATTEMPT+1))
        done

        if [ ! -f vibescan-results.json ]; then
          echo "⚠️ Scan did not complete within timeout, continuing without blocking"
          exit 0
        fi

        SCORE=$(jq -r '.score' vibescan-results.json)
        CRITICAL=$(jq -r '.findings | map(select(.severity=="critical")) | length' vibescan-results.json)
        IMPORTANT=$(jq -r '.findings | map(select(.severity=="important")) | length' vibescan-results.json)
        TOTAL=$(jq -r '.findings | length' vibescan-results.json)
        REPORT_URL="https://vibecodescan.vercel.app/scan/$(jq -r '.scanId' vibescan-results.json)"

        echo "score=$SCORE" >> $GITHUB_OUTPUT
        echo "critical-count=$CRITICAL" >> $GITHUB_OUTPUT
        echo "total-findings=$TOTAL" >> $GITHUB_OUTPUT
        echo "report-url=$REPORT_URL" >> $GITHUB_OUTPUT

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "VibeScan Results — Score: $SCORE"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Critical: $CRITICAL | Important: $IMPORTANT | Total: $TOTAL"
        echo "Report: $REPORT_URL"
        echo ""

        if [ "$TOTAL" -gt "0" ]; then
          jq -r '.findings[] | "  [\(.severity | ascii_upcase)] \(.title)"' vibescan-results.json
        fi

        if [ "${{ inputs.fail-on-critical }}" = "true" ] && [ "$CRITICAL" -gt "0" ]; then
          echo ""
          echo "❌ $CRITICAL critical security issue(s) found. Fix before deploying: $REPORT_URL"
          exit 1
        fi

        if [ "${{ inputs.fail-on-important }}" = "true" ] && [ "$IMPORTANT" -gt "0" ]; then
          echo "❌ $IMPORTANT important issue(s) found."
          exit 1
        fi

        echo "✅ No blocking issues found."

    - name: Comment on PR
      if: |
        inputs.comment-on-pr == 'true' &&
        github.event_name == 'pull_request' &&
        always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          let results;
          try {
            results = JSON.parse(fs.readFileSync('vibescan-results.json', 'utf8'));
          } catch { return; }

          const critical = results.findings.filter(f => f.severity === 'critical').length;
          const emoji = { A: '✅', B: '🟡', C: '🟠', D: '🔴', F: '🚨' }[results.score] ?? '❓';

          const rows = results.findings.slice(0, 5)
            .map(f => `| ${f.severity === 'critical' ? '🔴' : '🟡'} | ${f.title} | ${f.consequence} |`)
            .join('\n');

          const body = [
            `## ${emoji} VibeScan Security Report — Score: ${results.score}`,
            '',
            critical > 0
              ? `> ⚠️ **${critical} critical issue(s) found.**`
              : `> ✅ No critical issues.`,
            '',
            rows ? '| Severity | Issue | Impact |\n|---|---|---|\n' + rows : '',
            '',
            `[Full report with fix prompts →](https://vibecodescan.vercel.app/scan/${results.scanId})`,
          ].filter(Boolean).join('\n');

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body,
          });
